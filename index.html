<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#27394b">
  <title>Location Sharing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      color: #273746;
      font-family: Arial, Helvetica, sans-serif;
    }
    .topbar {
      height: 64px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      background: #27394b;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }
    main {
      width: min(92%, 760px);
      margin: 58px auto;
      text-align: center;
    }
    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #18a77b;
      color: white;
      font-size: 34px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(27px, 5vw, 34px);
      color: #27394b;
    }
    .panel {
      max-width: 650px;
      margin: auto;
      padding: 22px;
      border: 1px solid #e1e6eb;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(30, 48, 65, .06);
    }
    .notice {
      margin: 0;
      color: #425466;
      font-size: 15px;
      line-height: 1.6;
    }
    #status {
      min-height: 24px;
      margin: 16px 0 0;
      color: #526477;
      font-size: 14px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 18px; }
      main { margin-top: 42px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">LOCATION</header>

  <main>
    <div class="logo" aria-hidden="true">⌖</div>
    <h1>Location Sharing</h1>

    <section class="panel">
      <p class="notice">
        If you allow location access, your current GPS location will be sent
        to the website owner's Telegram account.
      </p>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL = "https://uzykphfpnzcqpucrnanb.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_c3dkueuOAUh9Elk07iWDgQ_X2p3I0Ea";

    const statusBox = document.getElementById("status");
    const token = new URLSearchParams(location.search).get("token");

    function status(message) {
      statusBox.textContent = message;
    }

    async function sendLocation(position) {
      status("Sending your location…");

      try {
        const response = await fetch(
          SUPABASE_URL + "/functions/v1/submit-report",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLISHABLE_KEY
            },
            body: JSON.stringify({
              token,
              consent: true,
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            })
          }
        );

        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.success !== true) {
          throw new Error(result.error || "Location could not be sent.");
        }

        status("Location shared successfully.");

        // Redirect only after the server confirms successful submission.
        const cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete("token");
        history.replaceState({}, "", cleanUrl);

        window.location.replace("https://fdown.net/");
      } catch (error) {
        status(error.message || "Unable to send location. Please try again.");
      }
    }

    function requestLocation() {
      if (!token) {
        status("This invite link is invalid or incomplete.");
        return;
      }

      if (!window.isSecureContext) {
        status("Please open this page using its secure HTTPS link.");
        return;
      }

      if (!navigator.geolocation) {
        status("Location is not supported by this browser.");
        return;
      }

      status("Waiting for your browser's location permission…");

      navigator.geolocation.getCurrentPosition(
        sendLocation,
        error => {
          if (error.code === 1) {
            status("Permission denied. No location was sent.");
          } else if (error.code === 2) {
            status("Location unavailable. Check your device's location setting.");
          } else if (error.code === 3) {
            status("Location request timed out. Please try again.");
          } else {
            status("Could not access location. No location was sent.");
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    window.addEventListener("load", requestLocation);
  </script>
</body>
</html>
